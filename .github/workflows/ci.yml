name: CI & Governance Checks

on:
  push:
    branches: [main, chore/agentic-scaffold]
  pull_request:
    branches: [main]
    # labeled/unlabeled: re-run so the snapshot guard sees data-publish label changes
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  verify-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Published Snapshot Changes
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch origin "${GITHUB_BASE_REF}"
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -qx 'dashboard/public/data.json'; then
            echo "$PR_LABELS" | grep -q '"data-publish"' || {
              echo "::error::dashboard/public/data.json changed but the PR lacks the 'data-publish' label."
              echo "See REVIEW.md: snapshot updates require a verified data/usage.db and the data-publish label."
              exit 1
            }
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Unit Tests
        run: |
          python -m pytest tests/unit/ -v --tb=short
          python -m pytest tests/browser/test_dashboard_production.py::TestSnapshotIntegrity tests/browser/test_dashboard_production.py::TestPagesWorkflowRegression -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Run OKF v0.2 Frontmatter Linter
        run: python scripts/lint_frontmatter.py

      - name: Smoke-Test Filter Output Script
        run: |
          python scripts/filter_output.py -- python -c "print('test passing')"
          python scripts/filter_output.py -- python -c "import sys; sys.stderr.write('err\n'); sys.exit(1)" || true

      - name: Test Dry-Run A/B Benchmark & Ledger
        run: |
          python scripts/run_experiment.py --task MOCK-001 --dry-run
          python scripts/ledger.py summary MOCK-001

      - name: Test Dashboard Arm Compatibility
        working-directory: dashboard
        run: |
          npm ci
          npm test

      - name: Build Dashboard Data & Compile Vite App
        run: |
          python dashboard/build_data.py
          cd dashboard
          npm run build
