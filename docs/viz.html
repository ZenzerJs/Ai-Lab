<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKF Knowledge Graph Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 16px; font-weight: 600; color: #38bdf8; }
    header .status { font-size: 12px; color: #94a3b8; }
    #cy {
      flex: 1;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>OKF v0.2 Knowledge Graph Visualizer</h1>
    <div class="status">Antigravity Knowledge Bundle</div>
  </header>
  <div id="cy"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [
          // Nodes
          { data: { id: 'root', label: 'docs/index.md\n(Bundle Root)', color: '#38bdf8' } },
          { data: { id: 'arch', label: 'Architecture Overview\n(concept)', color: '#818cf8' } },
          { data: { id: 'coding', label: 'Coding Standards\n(standard)', color: '#a78bfa' } },
          { data: { id: 'contracts', label: 'Data Contracts\n(schema)', color: '#f472b6' } },
          { data: { id: 'specs', label: 'SPEC-VERSIONS\n(standard)', color: '#34d399' } },
          { data: { id: 'log', label: 'docs/log.md\n(reserved log)', color: '#fbbf24' } },

          // Edges
          { data: { source: 'root', target: 'arch' } },
          { data: { source: 'root', target: 'coding' } },
          { data: { source: 'root', target: 'contracts' } },
          { data: { source: 'root', target: 'specs' } },
          { data: { source: 'arch', target: 'coding' } },
          { data: { source: 'arch', target: 'contracts' } },
          { data: { source: 'arch', target: 'specs' } },
          { data: { source: 'coding', target: 'contracts' } }
        ],
        style: [
          {
            selector: 'node',
            style: {
              'background-color': 'data(color)',
              'label': 'data(label)',
              'color': '#f8fafc',
              'font-size': '11px',
              'text-valign': 'center',
              'text-halign': 'center',
              'text-wrap': 'wrap',
              'width': 120,
              'height': 50,
              'shape': 'roundrectangle'
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 2,
              'line-color': '#475569',
              'target-arrow-color': '#64748b',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier'
            }
          }
        ],
        layout: {
          name: 'breadthfirst',
          roots: '#root',
          directed: true,
          padding: 30
        }
      });
    });
  </script>
</body>
</html>
