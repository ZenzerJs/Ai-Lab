[pytest]
# Tier 1 (Hermetic): Default test paths for fast, offline unit and integration tests.
# These tests run without external network, browser dependencies, or live servers:
#   uv run --isolated --python 3.12 --with pytest pytest
testpaths = tests/unit tests/integration
pythonpath = scripts dashboard

# Tier 2 (E2E / Playwright): Browser-based suites (tests/exp007 and tests/exp008).
# These suites require playwright and browser binaries, and are run explicitly:
#   EXP-007 (requires running server on port 8000):
#     uv run --with pytest --with pytest-playwright pytest tests/exp007
#   EXP-008 (file URI sandbox evaluation):
#     uv run --with pytest --with pytest-playwright pytest tests/exp008

